apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: taskboard14-dev
  namespace: argocd
spec:
  generators:
  - list:
      elements: []
  template:
    metadata:
      name: '{{name}}-dev'
    spec:
      project: default
      source:
        repoURL: https://github.com/ika100-demo/taskboard14-gitops
        targetRevision: main
        path: applications/taskboard14/overlays/dev/{{name}}
      destination:
        server: https://kubernetes.default.svc
        namespace: taskboard14-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
---
