apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard14-api
  labels:
    app: taskboard14-api
    app.kubernetes.io/name: taskboard14-api
    app.kubernetes.io/part-of: taskboard14
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard14-api.taskboard14-dev.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard14-api
      port: 80
